App\Entity\Location:
    properties:
        city:
            - NotBlank: { groups: [create, edit] }
            - Length: { min: 3, max: 255, groups: [create] }
            - Length: { min: 2, max: 255, groups: [edit] }
        country:
            - NotBlank: { groups: [create, edit] }
            - Country: { groups: [create, edit] }
        latitude:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -90, max: 90, groups: [create, edit] }
        longitude:
            - NotBlank: { groups: [create, edit] }
            - Range: { min: -180, max: 180, groups: [create, edit] }
